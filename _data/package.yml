name: Iterators
version: "1.0.0"
license: "GPL-2.0-or-later"
date: 2026-10-27
description: |
    Iterators of orders of simple groups and more

authors:
    - name: Stefan Kohl
      url: https://stefan-kohl.github.io/

maintainers:
    - name: Stefan Kohl
      url: https://stefan-kohl.github.io/

GAP: ">=4.16.1"

needed-pkgs:
    - name: "GAPDoc"
      version: ">=1.6.2"
      url: "https://www.math.rwth-aachen.de/~Frank.Luebeck/GAPDoc"
    - name: "utils"
      version: ">= 0.63"
      url: "https://gap-packages.github.io/utils"

www: https://gap-packages.github.io/iterators/
readme: README.md
packageinfo: https://gap-packages.github.io/iterators/PackageInfo.g

downloads:
    - name: .tar.gz
      url: https://github.com/gap-packages/iterators/releases/download/v1.0.0/iterators-1.0.0.tar.gz

abstract: |
    This package provides implementations of iterators running through orders and descriptions of non-abelian finite simple groups sorted by increasing order, and the groups in various group libraries coming with GAP, respectively.

status: dev
doc-html: doc/chap0.html
doc-pdf: doc/manual.pdf
keywords: |
    simple groups, group libraries, iterators, prime numbers.
